name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5

      - name: Install bpkg using vfox plugin from GitHub
        run: |
          mise install "vfox:mise-plugins/vfox-bpkg@1.1.3"

      - name: Test bpkg
        run: |
          mise x "vfox:mise-plugins/vfox-bpkg@1.1.3" -- bpkg --version
          mise x "vfox:mise-plugins/vfox-bpkg@1.1.3" -- bpkg --help
